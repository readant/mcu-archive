## IDF Component Manager Manifest File
dependencies:
  idf: ">=5.4"
  espressif/esp32_p4_function_ev_board_noglib:
    version: "*"
    rules:
     - if: "target == esp32p4"
  espressif/esp_video:
    version: "*"
    rules:
     - if: "target == esp32p4"
  espressif/dnesp32s3_board:
    version: "*"
    rules:
     - if: "target == esp32s3"
    override_path: "../../components/dnesp32s3_board"
  espressif/esp-dl:
    version: "*"